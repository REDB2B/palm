<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трастовые аккаунты Google Ads | Palma Media</title>
    <!-- Подключаем современный шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Подключаем наши стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Навигация -->
    <header class="header">
        <div class="container header-container">
            <div class="logo">
                PALMA <span>MEDIA</span>
            </div>
            <a href="#contact" class="btn btn-outline">Связаться</a>
        </div>
    </header>

    <!-- Главный экран (Hero) -->
    <section class="hero">
        <div class="container hero-container">
            <div class="hero-badge">Для Crypto, DeFi, Finance и Gambling</div>
            <h1 class="hero-title">Запускайте рекламу <span>без банов</span> на трастовых аккаунтах Google Ads</h1>
            <p class="hero-subtitle">Готовые решения под любой ГЕО (включая LatAm-Африка) и вертикаль. Быстрая замена при фризах и стабильный спенд.</p>
            
            <div class="hero-actions">
                <a href="#contact" class="btn btn-primary">Получить аккаунт</a>
            </div>

            <div class="hero-stats">
                <div class="stat-item">
                    <span class="stat-value">24ч</span>
                    <span class="stat-label">Выдача</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">4.5</span>
                    <span class="stat-label">Года на рынке</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">3000+</span>
                    <span class="stat-label">Продаж</span>
                </div>
            </div>
        </div>
        <!-- Декоративный фоновый элемент -->
        <div class="hero-glow"></div>
    </section>

</body>
</html>
